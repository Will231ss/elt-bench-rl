models:
  - name: publishers
    description: Each record represents a publisher.
    columns:
      - name: publisher_id
        description: Unique identifier for the publisher.
      - name: publisher_name
        description: Name of the publisher.
      - name: num_books
        description: Number of books published by the publisher, replace NULL values with 0.
      - name: title_of_the_oldest_book
        description: Title of the oldest book published by the publisher, with ties broken by the ascending order of the title.
      - name: avg_price
        description: Average price of the publisher's books, ignoring books without a price, rounded to 2 decimals.
  - name: authors
    description: Each record represents an author.
    columns:
      - name: author_id
        description: Unique identifier for the author.
      - name: author_name
        description: Name of the author.
      - name: num_books
        description: Number of books written by the author (co-authored books count for every author).
      - name: first_book
        description: Title of the first book written by the author, with ties broken by the ascending order of the title.
      - name: wrote_more_pages_than_average
        description: Set to 1 if the author's total pages are greater than the average total pages of all authors; otherwise, set to 0.
