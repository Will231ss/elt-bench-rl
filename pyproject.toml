[project]
name = "elt-bench-rl"
version = "0.1.0"
description = "ELT-Bench as an RLVR environment for tinker-cookbook"
requires-python = ">=3.11"
dependencies = [
    "tinker-cookbook",
    "duckdb>=1.3",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["elt_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
